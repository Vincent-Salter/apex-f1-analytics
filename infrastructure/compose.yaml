services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: apex
      POSTGRES_USER: apex_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - apex_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex_app -d apex"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  apex_postgres_data:
